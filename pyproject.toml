[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-length"
version = "0.1.0"
description = "Estimate the equivalent word count of APS LaTeX manuscripts"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
aps-length = "aps_length.cli:main"

[tool.setuptools]
packages = ["aps_length"]

[tool.setuptools.package-data]
aps_length = ["wordcount.tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
